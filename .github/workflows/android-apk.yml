name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Debug & Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Web Dependencies & Build Vite Bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Sync Web Bundle into Android Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/*
          cp -r dist/* android/app/src/main/assets/public/

      - name: Setup Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Install Build Tools (API 34)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Release Signing Keystore
        working-directory: android
        run: |
          rm -f release-keystore.jks
          keytool -genkeypair -v \
            -keystore release-keystore.jks \
            -alias dimenueveis \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass dimenueveis123 \
            -keypass dimenueveis123 \
            -dname "CN=Calendario das Dimenuveis, OU=Calendar, O=Dimenuveis, L=SaoPaulo, ST=SP, C=BR"

      - name: Build Android Debug & Signed Release APKs
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/release-keystore.jks
          KEYSTORE_PASSWORD: dimenueveis123
          KEY_ALIAS: dimenueveis
          KEY_PASSWORD: dimenueveis123
        run: |
          FOOTER_VER=$(grep -oE "Version [0-9]+(\.[0-9]+)*" ../src/App.tsx | head -n 1 | awk '{print $2}')
          APP_VERSION="${FOOTER_VER:-1.9}"
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          gradle assembleDebug assembleRelease --no-daemon --stacktrace
          mkdir -p ../apk-output
          cp app/build/outputs/apk/debug/app-debug.apk "../apk-output/Calendario-das-Dimenuveis-v${APP_VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "../apk-output/Calendario-das-Dimenuveis-v${APP_VERSION}-release.apk"

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calendario-das-Dimenuveis-v${{ env.APP_VERSION }}-release-apk
          path: apk-output/Calendario-das-Dimenuveis-v${{ env.APP_VERSION }}-release.apk
          if-no-files-found: error

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calendario-das-Dimenuveis-v${{ env.APP_VERSION }}-debug-apk
          path: apk-output/Calendario-das-Dimenuveis-v${{ env.APP_VERSION }}-debug.apk
          if-no-files-found: error
